<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Order Falak 1259 — £295, made by hand in a numbered first series. Reserve a number." />
  <meta name="theme-color" content="#14100b" />
  <title>Order · Falak 1259</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='none' stroke='%23c8a24c' stroke-width='5'%3E%3Ccircle cx='50' cy='50' r='38'/%3E%3Ccircle cx='69' cy='50' r='19'/%3E%3Cline x1='12' y1='50' x2='88' y2='50'/%3E%3C/g%3E%3C/svg%3E" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" data-site-header></header>

  <main id="main">
    <section class="section section--tight">
      <div class="wrap">
        <p class="eyebrow" data-content="order.eyebrow">Order</p>
        <h1 data-content="order.title" style="font-size:clamp(2.2rem,5vw,3.6rem);margin:0 0 1.6rem;"></h1>
        <p class="lede" style="max-width:52ch;" data-content="order.lede"></p>
      </div>
    </section>

    <hr class="rule wrap" />

    <section class="section">
      <div class="wrap order-grid">

        <!-- Left: price, series, contents -->
        <div>
          <p class="price" data-content="order.price">£295</p>
          <p class="subhead" data-content-html="order.seriesHeading">Limited &amp; numbered</p>
          <p class="muted" data-content="order.seriesNote"></p>

          <p class="subhead" style="margin-top:2.5rem;" data-content="order.includedHeading">What arrives</p>
          <ul class="included" data-build="order-included"></ul>
        </div>

        <!-- Right: reservation form -->
        <div>
          <h2 style="margin:0 0 .6rem;" data-content="order.form.heading">Reserve a number</h2>
          <p class="form__note" data-content="order.form.note"></p>

          <form class="form" data-form="order.form" style="margin-top:1.6rem;" novalidate>
            <div class="field">
              <label for="o-name" data-content="order.form.fields.name.label">Name</label>
              <input id="o-name" name="name" type="text" autocomplete="name" required
                     data-content-ph="order.form.fields.name.placeholder" placeholder="Your name" />
            </div>
            <div class="field">
              <label for="o-email" data-content="order.form.fields.email.label">Email</label>
              <input id="o-email" name="email" type="email" autocomplete="email" required
                     data-content-ph="order.form.fields.email.placeholder" placeholder="you@example.com" />
            </div>
            <div class="field">
              <label for="o-intent" data-content="order.form.fields.intent.label">I'm writing to</label>
              <select id="o-intent" name="intent" data-build="order-intents"></select>
            </div>
            <div class="field">
              <label for="o-message" data-content="order.form.fields.message.label">Message (optional)</label>
              <textarea id="o-message" name="message"
                        data-content-ph="order.form.fields.message.placeholder" placeholder="Anything you'd like us to know"></textarea>
            </div>
            <div class="form__actions">
              <button class="btn btn--solid" type="submit" data-content="order.form.submit">Send reservation</button>
              <p class="form-status" data-form-status role="status" aria-live="polite"></p>
            </div>
          </form>
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer" data-site-footer></footer>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/render.js" defer></script>
</body>
</html>
