<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Groundwork — food &amp; gut journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,420;0,9..144,560;0,9..144,650;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A1C; --ink-soft:#56634F; --ink-faint:#8A9480;
    --paper:#E9EADD; --surface:#FBFBF5; --surface-2:#F1F1E5;
    --line:#CBCDB9; --line-soft:#DBDCCB;
    --accent:#45694A; --accent-ink:#F4F6EE;
    --low:#3F7A4C; --low-bg:#E3EEDF;
    --med:#AD7E22; --med-bg:#F4EAD3;
    --high:#A24A2E; --high-bg:#F2E0D6;
    --shadow: 0 1px 2px rgba(30,42,28,.06), 0 6px 18px rgba(30,42,28,.07);
    --radius: 10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#E9ECE2; --ink-soft:#AEB8A4; --ink-faint:#71806A;
      --paper:#161C14; --surface:#1E251B; --surface-2:#232B1F;
      --line:#38412F; --line-soft:#2B3326;
      --accent:#7FAE80; --accent-ink:#12170F;
      --low:#7FAE80; --low-bg:#20301F;
      --med:#D7AE5C; --med-bg:#332A15;
      --high:#D98A6B; --high-bg:#3A231A;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#E9ECE2; --ink-soft:#AEB8A4; --ink-faint:#71806A;
    --paper:#161C14; --surface:#1E251B; --surface-2:#232B1F;
    --line:#38412F; --line-soft:#2B3326;
    --accent:#7FAE80; --accent-ink:#12170F;
    --low:#7FAE80; --low-bg:#20301F;
    --med:#D7AE5C; --med-bg:#332A15;
    --high:#D98A6B; --high-bg:#3A231A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter', system-ui, sans-serif; font-size:15px; line-height:1.5;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:650; margin:0; letter-spacing:-.01em; }
  button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; }
  a{ color:inherit; }
  ::selection{ background:var(--low-bg); }

  .app{ display:flex; min-height:100%; max-width:1180px; margin:0 auto; }

  /* ---------- Sidebar nav ---------- */
  .nav{
    width:208px; flex-shrink:0; padding:28px 14px; border-right:1px solid var(--line);
    display:flex; flex-direction:column; gap:28px; position:sticky; top:0; align-self:flex-start;
    height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:9px; padding:0 8px; }
  .brand svg{ width:22px; height:22px; flex-shrink:0; }
  .brand-text h1{ font-size:19px; line-height:1.1; }
  .brand-text span{ font-size:11.5px; color:var(--ink-faint); }
  .nav-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
    color:var(--ink-soft); font-size:14.5px; font-weight:500; border:none; background:none; width:100%; text-align:left;
  }
  .nav-item svg{ width:17px; height:17px; flex-shrink:0; opacity:.85; }
  .nav-item:hover{ background:var(--surface-2); color:var(--ink); }
  .nav-item.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .nav-foot{ margin-top:auto; padding:0 8px; font-size:12px; color:var(--ink-faint); line-height:1.5; }
  .nav-foot button{ background:none; border:none; padding:0; color:var(--ink-soft); text-decoration:underline; text-underline-offset:2px; font-size:12px; }

  /* mobile bottom nav */
  .tabbar{ display:none; }

  main{ flex:1; min-width:0; padding:28px 32px 60px; }
  .topline{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .topline h2{ font-size:26px; }
  .topline .sub{ color:var(--ink-soft); font-size:13.5px; }

  .dateswitch{ display:flex; align-items:center; gap:4px; }
  .dateswitch button{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
  }
  .dateswitch button:hover{ background:var(--surface-2); }
  .dateswitch .label{ font-size:14px; font-weight:600; min-width:150px; text-align:center; }
  .dateswitch .today-pill{
    font-size:11.5px; border:1px solid var(--line); border-radius:999px; padding:3px 10px; color:var(--ink-soft); background:var(--surface); margin-left:4px;
  }

  /* ---------- Summary card ---------- */
  .summary{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:20px 22px; margin-bottom:22px; position:relative; overflow:hidden;
  }
  .summary-leaf{ position:absolute; right:-10px; top:-10px; width:120px; height:120px; opacity:.07; pointer-events:none; }
  .summary-grid{ display:grid; grid-template-columns: auto 1fr; gap:26px; align-items:center; }
  .kcal-block{ min-width:118px; }
  .kcal-num{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:34px; line-height:1; }
  .kcal-label{ font-size:12px; color:var(--ink-soft); margin-top:5px; }
  .meters{ display:flex; flex-direction:column; gap:14px; }
  .meter-row .meter-top{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-bottom:5px; }
  .groupbar{ height:9px; border-radius:5px; background:var(--surface-2); overflow:hidden; display:flex; border:1px solid var(--line-soft); }
  .groupbar span{ height:100%; }
  .groupbar.empty{ background:repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 6px, var(--line-soft) 6px, var(--line-soft) 7px); }
  .histbar{ height:9px; border-radius:5px; background:var(--surface-2); border:1px solid var(--line-soft); position:relative; overflow:hidden; }
  .histbar .fill{ height:100%; border-radius:5px; }
  .hist-label{ font-size:12px; font-weight:600; }
  .legend{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
  .legend-item{ display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-soft); }
  .legend-dot{ width:8px; height:8px; border-radius:2px; display:inline-block; }

  /* ---------- Log form ---------- */
  .logbtn{
    display:inline-flex; align-items:center; gap:7px; background:var(--accent); color:var(--accent-ink);
    border:none; padding:10px 16px; border-radius:8px; font-weight:600; font-size:14px; margin-bottom:18px;
  }
  .logbtn:hover{ filter:brightness(1.06); }
  .logbtn svg{ width:15px; height:15px; }

  .form-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:20px 22px; margin-bottom:22px;
  }
  .form-card h3{ font-size:16px; margin-bottom:14px; }
  .field-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .field{ display:flex; flex-direction:column; gap:5px; flex:1; min-width:140px; }
  .field.small{ flex:0 0 90px; min-width:90px; }
  .field label{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }
  .field input, .field select, .field textarea{
    border:1px solid var(--line); background:var(--paper); border-radius:7px; padding:8px 10px; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .match-hint{ font-size:12px; color:var(--ink-soft); margin-top:-4px; margin-bottom:10px; min-height:16px; }
  .match-hint b{ color:var(--ink); }
  .ask-claude-btn{ background:none; border:none; padding:0; color:var(--accent); font-weight:600; font-size:12px; text-decoration:underline; text-underline-offset:2px; display:inline-flex; align-items:center; gap:4px; }
  .ask-claude-btn svg{ width:11px; height:11px; }
  .photo-row{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .photo-preview{ width:56px; height:56px; border-radius:7px; object-fit:cover; border:1px solid var(--line); background:var(--surface-2); }
  .photo-btn{ border:1px dashed var(--line); background:var(--surface-2); border-radius:7px; padding:8px 12px; font-size:13px; color:var(--ink-soft); }
  .photo-btn:hover{ color:var(--ink); border-color:var(--ink-faint); }
  .swap-note{
    display:flex; gap:9px; background:var(--med-bg); color:var(--ink); border:1px solid var(--line-soft);
    border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:14px; align-items:flex-start;
  }
  .swap-note.high{ background:var(--high-bg); }
  .swap-note svg{ width:15px; height:15px; margin-top:1px; flex-shrink:0; }
  .food-row{ display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; margin-bottom:3px; }
  .food-row .field{ min-width:0; }
  .row-remove{ background:none; border:1px solid var(--line); border-radius:7px; width:34px; height:34px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--ink-faint); }
  .row-remove:hover{ color:var(--high); border-color:var(--high); }
  .addrow-btn{ display:inline-flex; align-items:center; gap:6px; background:none; border:1px dashed var(--line); border-radius:7px; padding:7px 12px; font-size:12.5px; color:var(--ink-soft); margin:2px 0 16px; }
  .addrow-btn:hover{ color:var(--ink); border-color:var(--ink-faint); }
  .addrow-btn svg{ width:13px; height:13px; }
  .combined-preview{
    background:var(--surface-2); border:1px solid var(--line-soft); border-radius:8px; padding:10px 13px;
    font-size:13px; margin-bottom:14px; display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  }
  .combined-preview .ck{ font-family:'IBM Plex Mono', monospace; font-weight:600; }
  .entry-items{ display:flex; flex-wrap:wrap; gap:7px; margin-top:9px; }
  .entry-items .tag{
    background:var(--surface-2); border:1px solid var(--line-soft); padding:3px 9px; border-radius:999px; gap:6px;
  }
  .form-actions{ display:flex; gap:10px; justify-content:flex-end; }
  .btn-ghost{ background:none; border:1px solid var(--line); border-radius:7px; padding:9px 14px; font-size:13.5px; color:var(--ink-soft); }
  .btn-ghost:hover{ color:var(--ink); }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); border:none; border-radius:7px; padding:9px 16px; font-size:13.5px; font-weight:600; }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-primary:disabled{ opacity:.55; cursor:default; }

  /* ---------- Entry list ---------- */
  .entry-list{ display:flex; flex-direction:column; gap:10px; }
  .entry{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:13px 14px; display:flex; gap:12px; align-items:flex-start;
  }
  .entry-thumb{ width:52px; height:52px; border-radius:8px; object-fit:cover; flex-shrink:0; background:var(--surface-2); border:1px solid var(--line-soft); }
  .entry-thumb.placeholder{ display:flex; align-items:center; justify-content:center; color:var(--ink-faint); }
  .entry-thumb.placeholder svg{ width:20px; height:20px; }
  .entry-body{ flex:1; min-width:0; }
  .entry-top{ display:flex; justify-content:space-between; gap:10px; }
  .entry-name{ font-weight:600; font-size:14.5px; }
  .entry-time{ font-size:12px; color:var(--ink-faint); white-space:nowrap; font-family:'IBM Plex Mono', monospace; }
  .entry-meta{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; align-items:center; }
  .tag{ display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-soft); }
  .tag svg{ width:13px; height:13px; opacity:.8; }
  .kcal-chip{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; font-weight:600; color:var(--ink); }
  .hist-chip{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; }
  .hist-chip.low{ background:var(--low-bg); color:var(--low); }
  .hist-chip.medium{ background:var(--med-bg); color:var(--med); }
  .hist-chip.high{ background:var(--high-bg); color:var(--high); }
  .entry-swap{ font-size:12.5px; color:var(--ink-soft); margin-top:7px; display:flex; gap:6px; }
  .entry-swap svg{ width:13px; height:13px; margin-top:1px; flex-shrink:0; opacity:.8; }
  .entry-note{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; font-style:italic; }
  .entry-del{ background:none; border:none; color:var(--ink-faint); padding:4px; border-radius:6px; flex-shrink:0; }
  .entry-del:hover{ color:var(--high); background:var(--high-bg); }
  .entry-del svg{ width:15px; height:15px; display:block; }

  .empty{
    border:1px dashed var(--line); border-radius:var(--radius); padding:30px 20px; text-align:center;
    color:var(--ink-soft); font-size:13.5px;
  }
  .empty h4{ font-family:'Fraunces', serif; font-size:16px; color:var(--ink); margin-bottom:5px; font-weight:560;}

  /* ---------- History ---------- */
  .history-day{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;
    display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; width:100%; text-align:left;
  }
  .history-day:hover{ border-color:var(--ink-faint); }
  .history-date{ font-weight:600; font-size:14.5px; }
  .history-sub{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
  .history-right{ display:flex; align-items:center; gap:14px; }
  .history-kcal{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:14px; }

  /* ---------- Guide ---------- */
  .guide-intro{
    background:var(--surface-2); border:1px solid var(--line-soft); border-radius:var(--radius);
    padding:14px 16px; font-size:13px; color:var(--ink-soft); margin-bottom:20px; line-height:1.55;
  }
  .guide-search{ margin-bottom:18px; }
  .guide-search input{ width:100%; max-width:360px; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:9px 12px; }
  .guide-section{ margin-bottom:26px; }
  .guide-section h3{ font-size:15px; display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .guide-dot{ width:9px; height:9px; border-radius:2px; display:inline-block; }
  .guide-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:10px; }
  .guide-card{ background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:11px 13px; }
  .guide-card .gname{ font-weight:600; font-size:13.5px; }
  .guide-card .gmeta{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }
  .guide-card .gswap{ font-size:12px; color:var(--ink-soft); margin-top:7px; display:flex; gap:5px; }
  .guide-card .gswap svg{ width:12px; height:12px; margin-top:1px; flex-shrink:0; opacity:.75; }

  .section-divider{ margin:36px 0 16px; display:flex; align-items:center; gap:10px; color:var(--ink-soft); font-size:13px; }
  .section-divider::after{ content:""; flex:1; height:1px; background:var(--line-soft); }
  .section-divider svg{ width:15px; height:15px; opacity:.8; }

  .bristol-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(82px,1fr)); gap:8px; margin-bottom:6px; }
  .bristol-btn{ border:1px solid var(--line); background:var(--surface); border-radius:9px; padding:10px 6px 8px; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10.5px; color:var(--ink-soft); text-align:center; line-height:1.25; }
  .bristol-btn .bn{ font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:17px; color:var(--ink); }
  .bristol-btn:hover{ border-color:var(--ink-faint); }
  .bristol-btn.selected{ border-color:var(--accent); background:var(--low-bg); }
  .bristol-btn.selected .bn{ color:var(--accent); }
  .bristol-desc{ font-size:12.5px; color:var(--ink-soft); margin:4px 0 14px; min-height:16px; }

  .stool-list{ display:flex; flex-direction:column; gap:10px; }
  .stool-entry{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; display:flex; gap:12px; align-items:center; }
  .stool-badge{ width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:15px; flex-shrink:0; }
  .stool-badge.constipation{ background:var(--med-bg); color:var(--med); }
  .stool-badge.normal{ background:var(--low-bg); color:var(--low); }
  .stool-badge.loose{ background:var(--high-bg); color:var(--high); }
  .stool-body{ flex:1; min-width:0; }
  .stool-top{ display:flex; justify-content:space-between; gap:10px; }
  .stool-label{ font-weight:600; font-size:14px; }
  .stool-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .stool-note{ font-size:12.5px; color:var(--ink-soft); margin-top:5px; font-style:italic; }

  footer.disclaimer{
    margin-top:30px; font-size:11.5px; color:var(--ink-faint); line-height:1.6; border-top:1px solid var(--line-soft); padding-top:16px;
  }

  @media (max-width: 860px){
    .app{ flex-direction:column; }
    .nav{ display:none; }
    .tabbar{
      display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--line);
      padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px)); justify-content:space-around; z-index:20;
    }
    .tabbar button{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink-faint); font-size:10.5px; font-weight:600; padding:4px 10px; }
    .tabbar button svg{ width:19px; height:19px; }
    .tabbar button.active{ color:var(--accent); }
    main{ padding:20px 16px 90px; }
    .summary-grid{ grid-template-columns:1fr; gap:16px; }
    .brand{ padding:16px 4px 0; }
  }
</style>
</head>
<body>
<div class="app">

  <nav class="nav" id="sidenav">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 21c-4-3-7-7-7-11a7 7 0 0 1 14 0c0 4-3 8-7 11Z" stroke="var(--accent)" stroke-width="1.6"/><path d="M12 10v8M12 10c0-3 2-5 5-5M12 10c0-2.5-1.7-4.3-4-4.6" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round"/></svg>
      <div class="brand-text"><h1>Groundwork</h1><span>food &amp; gut journal</span></div>
    </div>
    <ul class="nav-list" id="navList"></ul>
    <div class="nav-foot">
      Private to you. Saved to <span id="whoAmI">—</span>.
    </div>
  </nav>

  <main id="main"></main>
</div>

<div class="tabbar" id="tabbar"></div>

<script>
(function(){
  "use strict";

  /* ============ Icons ============ */
  const ICONS = {
    today: '<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M4 9h16M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    history: '<svg viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 1 0 3-6.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M3 4v5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    guide: '<svg viewBox="0 0 24 24" fill="none"><path d="M5 4h10a2 2 0 0 1 2 2v14l-7-3-7 3V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',

  /* ============ Image handling ============ */
  function compressImage(file){
    return new Promise((resolve, reject)=>{
      const img = new Image();
      const reader = new FileReader();
      reader.onload = ()=>{ img.onload = ()=>{
          const maxDim = 640;
          let {width, height} = img;
          if(width > height && width > maxDim){ height = height*(maxDim/width); width = maxDim; }
          else if(height > maxDim){ width = width*(maxDim/height); height = maxDim; }
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          canvas.toBlob(blob=>resolve(blob), "image/jpeg", 0.72);
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  }
  function entryTotals(e){
    const items = entryItems(e);
    const order = {low:1, medium:2, high:3};
    let kcal = 0, worst = "low";
    items.forEach(it=>{
      kcal += (it.kcal||0) * (it.servings||1);
      if(order[it.histamine] > order[worst]) worst = it.histamine;
    });
    const mealName = e.mealName || items.map(it=>it.name).join(", ");
    return { items, kcal, histamine: worst, mealName };
  }

        const k = (it.kcal||0) * (it.servings||1);
        kcal += k;
        groupKcal[it.group] = (groupKcal[it.group]||0) + k;
        histPoints += HIST_SCORE[it.histamine]||0;
        count++;

    return { kcal, groupKcal, histPoints, count };

  function renderEntryCard(e){
    const { items, kcal, histamine, mealName } = entryTotals(e);
    const dt = new Date(e.timestamp || Date.now());
    const dominant = items[0] || {};
    const thumb = e.photoId ? `<img class="entry-thumb" src="/_blob/${e.photoId}" alt="">`
                : (e.photoData ? `<img class="entry-thumb" src="${e.photoData}" alt="">`
                : `<div class="entry-thumb placeholder">${GROUP_ICON[dominant.group]||ICONS.mixed}</div>`);

    const swapLines = items.filter(it=>it.histamine!=="low").map(it=>{
      const match = matchFood(it.name);
      const swap = it.swap || (match && match[4]) || GROUP_SWAP_DEFAULT[it.group];
      return swap ? `<div class="entry-swap">${ICONS.swap}<span>${items.length>1?`<b>${escapeHtml(it.name)}:</b> `:''}${escapeHtml(swap)}</span></div>` : "";

    const metaRow = items.length === 1
      ? `<div class="entry-meta">

          <span class="hist-chip ${histamine}">${HIST_LABEL[histamine]}</span>
        </div>`

          <span class="kcal-chip">${Math.round(kcal)} kcal total</span>

    return `
      <div class="entry" data-entry="${e.id}">
        ${thumb}
        <div class="entry-body">

            <div class="entry-name">${escapeHtml(mealName)}</div>

  const GROUP_OPTIONS = Object.keys(GROUP_LABEL).map(g=>`<option value="${g}">${GROUP_LABEL[g]}</option>`).join("");

          <input id="f-kcal-${i}" type="number" min="0" step="1" value="${item.kcal===""?"":item.kcal}">

  function renderForm(){

      <div class="form-card">
        <h3>Log food</h3>
        <div class="field" style="margin-bottom:14px">
          <label for="f-mealname">Meal name (optional — handy for a mixed plate)</label>

      <div class="stool-entry" data-stool="${s.id}">

  function renderStoolForm(){
    return `
      <div class="form-card">
        <h3>Log a bowel movement</h3>
        <div class="bristol-grid">
          ${BRISTOL.map(b=>`
            <button type="button" class="bristol-btn ${stoolFormType===b.n?'selected':''}" data-bristol="${b.n}">

  function renderStoolSection(ds){

      <div class="section-divider">${ICONS.drop}<span>Bowel movements${list.length?` · ${list.length} today`:''}</span></div>

      <div class="stool-list">
        ${list.length ? list.map(renderStoolEntryCard).join("") : `
          <div class="empty">

  function renderToday(){
    const list = entriesForDate(selectedDate).slice().sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
    return `
      <div class="topline">
        <div><h2>Food &amp; gut journal</h2><div class="sub">Log meals, track calories, and see your histamine load at a glance.</div></div>
        ${renderDateSwitcher()}
      </div>
      ${renderSummary(selectedDate)}
      ${formOpen ? renderForm() : `<button class="logbtn" id="open-form">${ICONS.plus} Log food</button>`}
      <div class="entry-list">
        ${list.length ? list.map(renderEntryCard).join("") : `
          <div class="empty">
            <h4>Nothing logged ${selectedDate===todayStr()?'today':'on this day'} yet</h4>
            <p>Add a meal or snack above — Groundwork will estimate calories, food group, and histamine level as you type.</p>
          </div>`}
      </div>
      ${renderStoolSection(selectedDate)}
      ${renderDisclaimer()}`;
  }

  function renderHistory(){
    const dates = [...new Set([...entries.map(e=>e.date), ...stools.map(s=>s.date)])].sort((a,b)=>b.localeCompare(a));
    return `
      <div class="topline"><div><h2>History</h2><div class="sub">Every day you've logged, most recent first.</div></div></div>
      ${dates.length ? dates.map(ds=>{
        const s = daySummary(ds);
        const st = stoolDaySummary(ds);
        const hist = histLabelForPoints(s.histPoints, s.count);
        return `<button class="history-day" data-jump="${ds}">
          <div><div class="history-date">${prettyDate(ds)}</div><div class="history-sub">${s.count} food item${s.count===1?'':'s'}${st.count?` · ${st.count} bowel movement${st.count===1?'':'s'}`:''}</div></div>
          <div class="history-right">
            ${s.count ? `<span class="hist-label" style="color:${hist.color}">${hist.label}</span>` : ''}
            ${s.kcal ? `<span class="history-kcal">${Math.round(s.kcal)} kcal</span>` : ''}
          </div>
        </button>`;
      }).join("") : `<div class="empty"><h4>No history yet</h4><p>Days you log will show up here so you can spot patterns over time.</p></div>`}
      ${renderDisclaimer()}`;
  }

  function renderGuide(){
    const q = (window.__guideQuery || "").toLowerCase();
    const filtered = FOODS.filter(f=>f[0].toLowerCase().includes(q));
    const sections = [
      {key:2, title:"High histamine", color:"var(--high)"},
      {key:1, title:"Medium histamine", color:"var(--med)"},
      {key:0, title:"Low histamine", color:"var(--low)"}
    ];
    return `
      <div class="topline"><div><h2>Swap guide</h2><div class="sub">A quick reference for common foods and gentler alternatives.</div></div></div>
      <div class="guide-intro">This is general reference information to help you spot patterns in your own log — it's not medical advice. Histamine sensitivity varies a lot between people; if you suspect an intolerance, a doctor or registered dietitian can help you confirm it and build a plan that actually fits you.</div>
      <div class="guide-search"><input id="guide-q" placeholder="Search foods…" value="${escapeHtml(window.__guideQuery||'')}"></div>
      ${sections.map(sec=>{
        const items = filtered.filter(f=>f[3]===sec.key);
        if(!items.length) return "";
        return `<div class="guide-section">
          <h3><span class="guide-dot" style="background:${sec.color}"></span>${sec.title}</h3>
          <div class="guide-grid">
            ${items.map(f=>`<div class="guide-card">
              <div class="gname">${escapeHtml(f[0])}</div>
              <div class="gmeta">${GROUP_LABEL[f[2]]} · ${f[1]} kcal /100${f[2]==='beverage'?'ml':'g'}</div>
              ${f[4] ? `<div class="gswap">${ICONS.swap}<span>Try: ${escapeHtml(f[4])}</span></div>` : ''}
            </div>`).join("")}
          </div>
        </div>`;
      }).join("")}
      ${renderDisclaimer()}`;
  }

  function renderDisclaimer(){
    return `<footer class="disclaimer">Groundwork gives general food, calorie, and histamine reference information to help you notice patterns. It isn't medical or nutrition advice and doesn't replace guidance from a doctor or registered dietitian — especially if you suspect histamine intolerance or another condition.</footer>`;
  }

  /* ============ Form logic & handlers ============ */
  function rowEls(i){
    return {
      name: document.getElementById("f-name-"+i),
      servings: document.getElementById("f-servings-"+i),
      kcal: document.getElementById("f-kcal-"+i),
      group: document.getElementById("f-group-"+i),
      hist: document.getElementById("f-hist-"+i),
      hint: document.getElementById("f-hint-"+i)
    };
  }

  function hintHTML(i, match, nameVal, aiEstimated){
    if(match){
      return `Matched <b>${escapeHtml(match[0])}</b> — ${match[1]} kcal /100${match[2]==='beverage'?'ml':'g'}, ${GROUP_LABEL[match[2]]}, ${HIST_LABEL[HIST_NAME[match[3]]].toLowerCase()}.`;
    }
    if(aiEstimated){
      const els = rowEls(i);
      return `Claude's estimate — ${els.kcal.value} kcal /100${els.group.value==='beverage'?'ml':'g'}, ${GROUP_LABEL[els.group.value]}, ${HIST_LABEL[els.hist.value].toLowerCase()}. Feel free to adjust.`;
    }
    if(!nameVal.trim() || nameVal.trim().length<2) return "";
    if(sample){
      return `No exact match — <button type="button" class="ask-claude-btn" data-askrow="${i}">${ICONS.leaf} Ask Claude to estimate</button>, or set the fields yourself.`;
    }
    return `No exact match — set calories, group, and histamine level yourself.`;
  }

  function bindHintAskButton(i){
    const els = rowEls(i);
    if(!els.hint) return;
    const btn = els.hint.querySelector("[data-askrow]");
    if(btn) btn.addEventListener("click", ()=>askClaudeForRow(i));
  }

  // Called while the user types a food name: autofills kcal/group/histamine from a local match.
  function onRowNameInput(i){
    const els = rowEls(i);
    if(!els.name) return;
    const match = matchFood(els.name.value);
    if(match){
      els.kcal.value = match[1];
      els.group.value = match[2];
      els.hist.value = HIST_NAME[match[3]];
    }
    els.hint.innerHTML = hintHTML(i, match, els.name.value, false);
    bindHintAskButton(i);
    updateCombinedPreview();
  }

  // Used after re-rendering rows (add/remove) to show hint text without overwriting user edits.
  function displayRowHint(i){
    const els = rowEls(i);
    if(!els.name) return;
    if(!els.name.value.trim()){ els.hint.innerHTML=""; return; }
    const match = matchFood(els.name.value);
    const wasAi = !match && formItems[i] && formItems[i].swap !== undefined && formItems[i].kcal;
    els.hint.innerHTML = hintHTML(i, match, els.name.value, wasAi);
    bindHintAskButton(i);
  }

  // Asks Claude to estimate kcal / food group / histamine level for a food not in the local reference list.
  async function askClaudeForRow(i){
    const els = rowEls(i);
    if(!els.name || !sample) return;
    const name = els.name.value.trim();
    if(!name) return;
    els.hint.innerHTML = `Asking Claude about <b>${escapeHtml(name)}</b>…`;
    try{
      const result = await sample.json(buildEstimatePrompt(name), { modelTier: "quick" });
      const kcal = Number(result && result.kcal);
      const group = (result && GROUP_LABEL[result.group]) ? result.group : "other";
      const histamine = (result && ["low","medium","high"].includes(result.histamine)) ? result.histamine : "low";
      const swap = (result && typeof result.swap === "string") ? result.swap : "";
      els.kcal.value = isNaN(kcal) ? 0 : Math.round(kcal);
      els.group.value = group;
      els.hist.value = histamine;
      if(formItems[i]) formItems[i].swap = swap; // carried through captureFormState / save
      els.hint.innerHTML = hintHTML(i, null, name, true);
      updateCombinedPreview();
    }catch(e){
      els.hint.innerHTML = `Couldn't get an estimate — set calories, group, and histamine level yourself. <button type="button" class="ask-claude-btn" data-askrow="${i}">Try again</button>`;
      bindHintAskButton(i);
    }
  }

  function readRowFromDOM(i){
    const els = rowEls(i);
    if(!els.name) return null;
    return {
      name: els.name.value,
      servings: parseFloat(els.servings.value) || 1,
      kcal: parseFloat(els.kcal.value) || 0,
      group: els.group.value,
      histamine: els.hist.value
    };
  }

  function captureFormState(){
    const read = [];
    for(let i=0;i<formItems.length;i++){
      const r = readRowFromDOM(i);
      if(r){
        if(formItems[i] && formItems[i].swap !== undefined && formItems[i].name === r.name) r.swap = formItems[i].swap;
        read.push(r);
      } else {
        read.push(formItems[i]);
      }
    }
    formItems = read;
    const mealEl = document.getElementById("f-mealname");
    const noteEl = document.getElementById("f-note");
    if(mealEl) formMealName = mealEl.value;
    if(noteEl) formNote = noteEl.value;
  }

  function updateCombinedPreview(){
    const box = document.getElementById("f-combined");
    if(!box) return;
    const order = {low:1, medium:2, high:3};
    let kcal = 0, worst = "low", named = 0;
    for(let i=0;i<formItems.length;i++){
      const r = readRowFromDOM(i);
      if(!r) continue;
      if(r.name.trim()) named++;
      kcal += (r.kcal||0) * (r.servings||1);
      if(order[r.histamine] > order[worst]) worst = r.histamine;
    }
    if(named===0){ box.innerHTML = `<span style="color:var(--ink-faint)">Add at least one food to see the combined total.</span>`; return; }
    const color = worst==="high" ? "var(--high)" : worst==="medium" ? "var(--med)" : "var(--low)";
    const swapNote = worst!=="low" ? `<span style="color:var(--ink-soft)">· consider a swap for the ${worst}-histamine item${named>1?'s':''} above</span>` : "";
    box.innerHTML = `<span><span class="ck">${Math.round(kcal)}</span> kcal combined</span><span style="color:${color};font-weight:600">${HIST_LABEL[worst]} overall</span>${swapNote}`;
  }

  function initPhotoPreview(){
    const prev = document.getElementById("f-photo-preview");
    const status = document.getElementById("f-photo-status");
    if(!prev) return;
    if(photoPreviewUrl){ prev.src = photoPreviewUrl; prev.style.display = "block"; if(status) status.textContent = "Photo added"; }
  }

  function initForm(){
    formItems.forEach((item,i)=>{
      const els = rowEls(i);
      if(!els.group) return;
      els.group.value = item.group;
      els.hist.value = item.histamine;
      els.name.addEventListener("input", ()=>onRowNameInput(i));
      els.servings.addEventListener("input", updateCombinedPreview);
      els.kcal.addEventListener("input", updateCombinedPreview);
      els.group.addEventListener("change", updateCombinedPreview);
      els.hist.addEventListener("change", updateCombinedPreview);
      displayRowHint(i);
    });
    updateCombinedPreview();
    initPhotoPreview();

    document.querySelectorAll("[data-removerow]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        captureFormState();
        const idx = parseInt(btn.getAttribute("data-removerow"),10);
        formItems.splice(idx,1);
        render();
      });
    });
    const addBtn = document.getElementById("f-addrow");
    if(addBtn) addBtn.addEventListener("click", ()=>{
      captureFormState();
      formItems.push(freshFormItem());
      render();
    });
  }

  function attachHandlers(){
    const openBtn = document.getElementById("open-form");
    if(openBtn) openBtn.addEventListener("click", ()=>{
      formOpen = true; formItems = [freshFormItem()]; formMealName=""; formNote="";
      photoBlob=null; photoPreviewUrl=null;
      render();
      document.getElementById("f-name-0").focus();
    });

    const cancelBtn = document.getElementById("f-cancel");
    if(cancelBtn) cancelBtn.addEventListener("click", ()=>{
      formOpen = false; formItems=[freshFormItem()]; formMealName=""; formNote="";
      photoBlob=null; photoPreviewUrl=null; render();
    });

    if(formOpen) initForm();

    const photoInput = document.getElementById("f-photo");
    if(photoInput){
      photoInput.addEventListener("change", async ()=>{
        const file = photoInput.files[0];
        if(!file) return;
        document.getElementById("f-photo-status").textContent = "Processing…";
        try{
          const blob = await compressImage(file);
          photoBlob = blob;
          photoPreviewUrl = URL.createObjectURL(blob);
          const prev = document.getElementById("f-photo-preview");
          prev.src = photoPreviewUrl; prev.style.display = "block";
          document.getElementById("f-photo-status").textContent = "Photo added";
        }catch(e){
          document.getElementById("f-photo-status").textContent = "Couldn't read that photo";
        }
      });
    }

    const saveBtn = document.getElementById("f-save");
    if(saveBtn){
      saveBtn.addEventListener("click", async ()=>{
        captureFormState();
        const items = formItems
          .map(r=>({ name:(r.name||"").trim(), servings:r.servings||1, kcal:r.kcal||0, group:r.group, histamine:r.histamine, swap:r.swap||undefined }))
          .filter(r=>r.name);
        if(!items.length){ document.getElementById("f-name-0").focus(); return; }
        saveBtn.disabled = true; saveBtn.textContent = "Saving…";
        const now = new Date();
        const entry = {
          mealName: formMealName.trim(),
          items,
          note: formNote.trim(),
          date: selectedDate,
          timestamp: now.getTime(),
          timeLabel: timeStr(now)
        };
        try{
          if(photoBlob){
            if(!offlineMode && assets){
              const res = await assets.upload(photoBlob, {type:"image/jpeg"});
              entry.photoId = res.id;
            } else {
              entry.photoData = await new Promise(res=>{
                const r = new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(photoBlob);
              });
            }
          }
          await saveEntry(entry);
        }catch(e){
          // fall back to local save if a remote write failed
          entries.unshift(Object.assign({id:"e"+Date.now()}, entry));
          lsSave(entries);
        }
        photoBlob = null; photoPreviewUrl = null; formOpen = false;
        formItems = [freshFormItem()]; formMealName=""; formNote="";
        render();
      });
    }

    document.querySelectorAll("[data-del]").forEach(btn=>{
      btn.addEventListener("click", ()=>{ deleteEntry(btn.getAttribute("data-del")); });
    });

    const openStoolBtn = document.getElementById("open-stool-form");
    if(openStoolBtn) openStoolBtn.addEventListener("click", ()=>{
      stoolFormOpen = true; stoolFormType = null; stoolFormNote = ""; render();
    });

    const stoolCancelBtn = document.getElementById("s-cancel");
    if(stoolCancelBtn) stoolCancelBtn.addEventListener("click", ()=>{
      stoolFormOpen = false; stoolFormType = null; stoolFormNote = ""; render();
    });

    document.querySelectorAll("[data-bristol]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const noteEl = document.getElementById("s-note");
        if(noteEl) stoolFormNote = noteEl.value;
        stoolFormType = parseInt(btn.getAttribute("data-bristol"),10);
        render();
      });
    });

    const stoolSaveBtn = document.getElementById("s-save");
    if(stoolSaveBtn){
      stoolSaveBtn.addEventListener("click", async ()=>{
        if(!stoolFormType) return;
        stoolSaveBtn.disabled = true; stoolSaveBtn.textContent = "Saving…";
        const now = new Date();
        const noteEl = document.getElementById("s-note");
        const entry = {
          type: stoolFormType,
          note: noteEl ? noteEl.value.trim() : "",
          date: selectedDate,
          timestamp: now.getTime(),
          timeLabel: timeStr(now)
        };
        try{ await saveStool(entry); }
        catch(e){ stools.unshift(Object.assign({id:"s"+Date.now()}, entry)); lsSaveStools(stools); }
        stoolFormOpen = false; stoolFormType = null; stoolFormNote = "";
        render();
      });
    }

    document.querySelectorAll("[data-delstool]").forEach(btn=>{
      btn.addEventListener("click", ()=>{ deleteStool(btn.getAttribute("data-delstool")); });
    });

    document.querySelectorAll("[data-dateshift]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const [y,m,d] = selectedDate.split("-").map(Number);
        const dt = new Date(y,m-1,d);
        dt.setDate(dt.getDate() + parseInt(btn.getAttribute("data-dateshift"),10));
        selectedDate = todayStr(dt);
        render();
      });
    });
    const goalBtn = document.querySelector("[data-goal='today']");
    if(goalBtn) goalBtn.addEventListener("click", ()=>{ selectedDate = todayStr(); render(); });

    document.querySelectorAll("[data-jump]").forEach(btn=>{
      btn.addEventListener("click", ()=>{ selectedDate = btn.getAttribute("data-jump"); view="today"; render(); renderNav(); });
    });

    const guideQ = document.getElementById("guide-q");
    if(guideQ){
      guideQ.addEventListener("input", ()=>{ window.__guideQuery = guideQ.value; render(); guideQ.focus(); guideQ.setSelectionRange(guideQ.value.length, guideQ.value.length); });
    }
  }

  init();
})();
</script>
</body>
</html>
